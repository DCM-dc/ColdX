name: Check ColdX

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: coldx-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
          package-manager-cache: false
      - name: Check release metadata and required source inputs
        run: node .github/scripts/check-release.mjs
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      # pretest regenerates the frontend, PDF runtime, branding and licenses.
      - run: pnpm test
